<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Project Creator – VCM</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style2.css" rel="stylesheet">
  <script src="js/web3.min.js"></script>
  <script src="js/vcm.js" defer></script>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">VCM Prototype</a>
    <div class="navbar-nav">
      <a class="nav-link" href="index.html">About BERP...</a>
      <a class="nav-link" href="owner.html">Owner</a>
      <a class="nav-link active" href="creator.html">Project Creator</a>
      <a class="nav-link" href="verifier.html">Verifier</a>
      <a class="nav-link" href="investor.html">Investor</a>
    </div>
  </div>
</nav>

<div class="container">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0">Create Project</h4>
          <small>Simuliert: Hardhat accounts[2]</small>
        </div>
        <div class="card-body">

          <div class="mb-3">
            <label class="form-label" for="projName">Project Name</label>
            <input id="projName" type="text" class="form-control" placeholder="Reforestation Peru">
          </div>

          <div class="mb-3">
          <label class="form-label" for="projPayout">Payout Address</label>
          <select id="projPayout" class="form-select">
            <option value="">Lade Adressen…</option>
          </select>
          <div class="form-text">
            Zieladresse für Auszahlungen (z.B. Investor).
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label" for="uploadFile">Projektdatei (IPFS)</label>
          <input id="uploadFile" type="file" class="form-control">
          <div class="form-text">
            Die Datei wird zu IPFS hochgeladen, der Hash wird automatisch unten eingetragen.
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label" for="projIpfs">IPFS Hash</label>
          <input id="projIpfs" type="text" class="form-control"
                placeholder="Wird nach dem Upload gesetzt" readonly>
        </div>


          <!-- <div class="mb-3">
            <label class="form-label" for="projDid">SSI DID Hash</label>
            <input id="projDid" type="text" class="form-control" placeholder="did:example:123">
          </div> -->
          <div class="mb-3">
            <label class="form-label" for="projDid">DID (wird automatisch gesetzt)</label>
            <input id="projDid" type="text" class="form-control" readonly>
          </div>


          <button class="btn btn-primary w-100" onclick="creatorCreateProject()">
            Create Project
          </button>
          <div id="verifierMessages"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
