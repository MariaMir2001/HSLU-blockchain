<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Investor – VCM</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link href="css/style2.css" rel="stylesheet">
  <script src="js/web3.min.js"></script>
  <script src="js/vcm.js" defer></script>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">VCM Prototype</a>
    <div class="navbar-nav">
      <a class="nav-link" href="index.html">About BERP...</a>
      <a class="nav-link" href="owner.html">Owner</a>
      <a class="nav-link" href="creator.html">Project Creator</a>
      <a class="nav-link" href="verifier.html">Verifier</a>
      <a class="nav-link active" href="investor.html">Investor</a>
    </div>
  </div>
</nav>

<div class="container">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0">Investor Dashboard</h4>
          <small>Simuliert: Hardhat accounts[3]</small>
        </div>
      <div class="card-body">

        <div class="mb-3">
          <label class="form-label" for="investorAddress">Select investor address</label>
          <select id="investorAddress" class="form-select">
            <option disabled selected>Loading investors…</option>
          </select>
          <div class="form-text">
            These are simulated Hardhat accounts acting as investors (e.g. 3, 8–11).
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label" for="investorDepositAmount">Deposit amount (ETH)</label>
          <input id="investorDepositAmount" type="text" class="form-control" placeholder="1.0">
        </div>

        <button class="btn btn-primary w-100 mb-3" onclick="investorDeposit()">
          Deposit into Funding Pool
        </button>

        <p class="small text-muted">
          The actual distribution of funds is triggered by the Owner (see Owner view).
        </p>

        <button class="btn btn-outline-secondary w-100 mb-3" onclick="investorLoadCertificates()">
          Show my certificates
        </button>

        <div id="investorCertificates" class="mt-3"></div>

        <!-- Nachrichten für den Investor -->
        <div id="verifierMessages"></div>
      </div>

      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
