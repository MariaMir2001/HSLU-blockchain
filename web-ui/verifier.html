<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Verifier – VCM</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="js/web3.min.js"></script>
  <script src="js/vcm.js" defer></script>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">VCM Prototype</a>
    <div class="navbar-nav">
      <a class="nav-link" href="owner.html">Owner</a>
      <a class="nav-link" href="creator.html">Project Creator</a>
      <a class="nav-link active" href="verifier.html">Verifier</a>
      <a class="nav-link" href="investor.html">Investor</a>
    </div>
  </div>
</nav>

<div class="container">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0">Verifier Dashboard</h4>
          <small>Simuliert: Hardhat accounts[1]</small>
        </div>
        <div class="card-body">

          <p class="small text-muted">
            Der Verifier prüft eingereichte Projekte und gibt sie für die Veröffentlichung frei.
          </p>

          <div class="mb-3">
            <label class="form-label" for="verifierProjectId">Project ID</label>
            <input id="verifierProjectId" type="number" min="1" class="form-control" placeholder="1">
          </div>

          <button class="btn btn-success w-100" onclick="verifierApproveProject()">
            Approve Project
          </button>

        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
